                <section data-type="text" data-popup="1" id="text" class="s-text-type-5 sb-text-dark"><link
                            id="text-type-5"
                            rel="stylesheet"
                            href="assets/styles/text-type-5.css"
                        /><div class="s-text-type-5__wrapper"> <div class=" sb-background sb-background" style="background: #fff;"></div> <div class="s-text-type-5__container">  <div class="s-text-type-5__image sb-text-white"> <div class="sb-background-image sb-background sb-background sb-background_clear" style="background-image: url(assets/img/dbcbf5c3-1542-44e8-9e28-da6ac17bc73a-7648342.jpeg);"><div class="sb-background-overlay" style="opacity: 0.6"></div></div> </div>   <div class="s-text-type-5__content sb-m-clear-bottom"><h4 class="sb-font-h4 sb-font-title sb-m-18-bottom">Лила. Самопознание.</h4> <div class="sb-align-left sb-font-p4">Изначальное название этой игры — Джняна-чаупада (джняна — знание, мудрость, чаупада — игра в кости; таким образом, название можно перевести как «Игра Знания»). По словам создателя современного варианта игры, Лила была создана святыми провидцами прошлого как ключ к внутренним состояниям и для изучения принципов Дхармы, которую обычно называют «индуизмом». Семьдесят две клетки игральной доски со всеми связывающими их стрелами и змеями, которые представляют семьдесят два основных плана бытия, открывают перед нами знания, заключённые в Ведах, Шрути, Смрити и Пуранах. Играть в эту игру — значит соприкасаться с божественной мудростью, которая содержится в учениях йоги, веданты и санкхьи, составляющих плоть и кровь индуистской традиции. В ходе игры вы автоматически передвигаетесь по полям игральной доски, каждое из которых имеет определённое название, отражающее одно из внутренних состояний, или планов бытия. Попадая на то или иное поле, игрок начинает обдумывать идеи и концепции, связанные с названием данного поля, до тех пор, пока снова не придёт его очередь бросить кость, чтобы перейти к следующему состоянию. В результате через несколько минут в игру вовлекаются ум, интеллект и эго (чувство «я») игрока.<br><br>Создатели игры видели в ней прежде всего инструмент, развивающий понимание взаимоотношений индивидуального «я» с Абсолютным «Я». Прохождение через игру с сохранением этой позиции помогает игроку освободиться от иллюзии, крепко опутавшей его личность, и увидеть свою жизнь как отражение макрокосма. Число, выпавшее на игральной кости, определяется не отождествлениями игрока, а взаимодействием космических сил, которые, в свою очередь, определяют развитие жизненной игры человека. И целью игры является освобождение сознания человека от оков материального мира и воссоединение его с Космическим Сознанием.<div><br></div><div><i><font style="color: #d7d7d7;"> источник: <a href="https://ru.wikipedia.org/wiki/Лила_(игра)" target="_blank" class="sb-link" data-link-id="0" style="">ru.wikipedia.org</a></font></i></div></div></div>  </div></div> </section> </template>
